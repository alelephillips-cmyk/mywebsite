<!DOCTYPE html>
<html>
<head>
<title>Premium Login</title>
<style>
body { font-family: Arial; background: #1a1a1a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.login-box { background: #222; padding: 30px; border-radius: 10px; width: 300px; }
h2 { text-align: center; color: #ffb6c1; }
input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
button { width: 100%; padding: 10px; background: #ffb6c1; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>
<div class="login-box">
<h2>Premium Access</h2>
<input type="text" id="user" placeholder="Username">
<input type="password" id="pass" placeholder="Password">
<button onclick="login()">Login</button>
</div>
<script>
function login() {
  let u = document.getElementById('user').value;
  let p = document.getElementById('pass').value;
  if (u === 'premium' && p === '9999') {
    localStorage.setItem('premium', 'yes');
    window.location.href = 'premium-dash.html';
  } else {
    alert('Wrong');
  }
}
</script>
</body>
</html>
