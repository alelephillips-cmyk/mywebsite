<!DOCTYPE html>
<html>
<head>
<title>KIUBY XMD - PREMIUM CONTROL</title>
<style>
@keyframes glitch {
  0% { text-shadow: 2px 0 red, -2px 0 cyan; }
  50% { text-shadow: -2px 0 red, 2px 0 cyan; }
  100% { text-shadow: 2px 0 red, -2px 0 cyan; }
}
body {
  background: radial-gradient(circle at top, #10002b, #000000);
  color: #d8b4ff;
  font-family: monospace;
  text-align: center;
  margin: 0;
  padding: 20px;
}
h1 {
  font-size: 2.2em;
  color: #bd93f9;
  animation: glitch 1s infinite;
  letter-spacing: 4px;
}
.subtitle {
  color: #9b6bff;
  margin-bottom: 30px;
  letter-spacing: 2px;
}
.card {
  background: rgba(150, 80, 255, 0.08);
  border: 1px solid #bd93f9;
  border-radius: 12px;
  padding: 15px;
  margin: 15px auto;
  max-width: 400px;
  box-shadow: 0 0 20px rgba(189,147,249,0.4);
}
.status-active {
  color: #39ff14;
  font-weight: bold;
}
.status-inactive {
  color: #ff2b5e;
  font-weight: bold;
}
</style>
</head>
<body>

<h1>☠ KIUBY XMD ☠</h1>
<div class="subtitle">— PREMIUM CONTROL PANEL —</div>

<div class="card">
  <div>User: 256742919783</div>
  <div class="status-active">STATUS: ACTIVE</div>
</div>

<div class="card">
  <div>User: 256700000000</div>
  <div class="status-inactive">STATUS: INACTIVE</div>
</div>

</body>
</html>
