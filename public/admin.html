<!DOCTYPE html>
<html>
<head>
<title>KIUBY ADMIN</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: monospace; background: #0a0a0a; color: #ccc; padding: 30px 20px; margin: auto; }
h2 { color: #2ee6a6; }
.box { border: 1px solid #2ee6a6; border-radius: 8px; padding: 15px; margin: 15px 0; background: #0f1a15; }
input { width: 70%; padding: 10px; background: #111; border: 1px solid #444; color: #fff; border-radius: 6px; }
button { padding: 10px 14px; background: #2ee6a6; color: #000; border: none; border-radius: 6px; font-weight: bold; margin-left: 5px; }
.item { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #222; }
.remove { background:#ff2e2e; color:#fff; padding:4px 10px; border-radius:4px; border:none; }
</style>
</head>
<body>
<h2>KIUBY ADMIN PANEL</h2>
<div class="box">
<b>Owner Number:</b> <span id="ownerNum">Loading...</span>
</div>
<div class="box">
<h2 style="margin-top:0">Add Premium Number</h2>
<input type="text" id="newNum" placeholder="e.g. 256700000000">
<button onclick="addPremium()">ADD</button>
</div>
<div class="box">
<h2 style="margin-top:0">Premium Users</h2>
<div id="premiumList">Loading...</div>
</div>

<script>
async function loadData() {
  const res = await fetch('/admin-data');
  const data = await res.json();
  document.getElementById('ownerNum').innerText = data.owner;
  const list = document.getElementById('premiumList');
  if (data.premium.length === 0) {
    list.innerHTML = '<p>No premium users yet.</p>';
  } else {
    list.innerHTML = data.premium.map(n => `<div class="item">${n} <button class="remove" onclick="removePremium('${n}')">Remove</button></div>`).join('');
  }
}
async function addPremium() {
  const num = document.getElementById('newNum').value.trim();
  if (!num) return;
  await fetch('/admin-data/add', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ number: num }) });
  document.getElementById('newNum').value = '';
  loadData();
}
async function removePremium(num) {
  await fetch('/admin-data/remove', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ number: num }) });
  loadData();
}
loadData();
</script>
</body>
</html>
