<!DOCTYPE html>
<html>
<head>
<title>KIUBY XMD</title>
<style>
body{margin:0;background:#000;overflow:hidden;font-family:monospace;color:#0f0;}
canvas{display:block;position:fixed;top:0;left:0;}
#login{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;background:rgba(0,0,0,0.6);}
h1{color:#0f0;text-shadow:0 0 10px #0f0;font-size:2em;letter-spacing:3px;}
input{background:#001a00;border:1px solid #0f0;color:#0f0;padding:10px;margin:5px;width:70%;font-family:monospace;}
button{background:#0f0;color:#000;border:none;padding:10px 20px;font-weight:bold;margin-top:10px;cursor:pointer;}
#msg{color:#f00;margin-top:10px;}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div id="login">
<h1>KIUBY XMD</h1>
<input type="text" id="user" placeholder="Username">
<input type="password" id="pass" placeholder="Password">
<button onclick="tryLogin()">ENTER</button>
<div id="msg"></div>
</div>
<script>
var c=document.getElementById('matrix');
var ctx=c.getContext('2d');
c.width=window.innerWidth;
c.height=window.innerHeight;
var letters="01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
var fontSize=16;
var columns=c.width/fontSize;
var drops=[];
for(var i=0;i<columns;i++)drops[i]=1;
function draw(){
ctx.fillStyle="rgba(0,0,0,0.05)";
ctx.fillRect(0,0,c.width,c.height);
ctx.fillStyle="#0f0";
ctx.font=fontSize+"px monospace";
for(var i=0;i<drops.length;i++){
var text=letters[Math.floor(Math.random()*letters.length)];
ctx.fillText(text,i*fontSize,drops[i]*fontSize);
if(drops[i]*fontSize>c.height && Math.random()>0.975)drops[i]=0;
drops[i]++;
}
}
setInterval(draw,33);
function tryLogin(){
var u=document.getElementById('user').value;
var p=document.getElementById('pass').value;
if(u==="kiuby" && p==="Pips256.."){
window.location.href="https://8730f495-6f13-46b7-b9f6-db4328e6c13b-00-343c32v6dlktf.reed.replit.dev/
}else{
document.getElementById('msg').innerText="Access Denied";
}
}
</script>
</body>
</html>
